# HTTP/WS 监听地址
listen: ":8080"
# 对外访问地址，用于拼接 GitHub OAuth 回调
publicUrl: https://monitor.example.com
# 仅本机开发可显式开启；必须同时将 listen 改为 127.0.0.1:8080。
# 开发时同时将 publicUrl 改为 http://127.0.0.1:8080（或删除 publicUrl）。
# 生产必须保持 false，并配置 HTTPS 反向代理及下方 GitHub OAuth。
insecureDevelopment: false
# SQLite 数据库文件路径
# Docker 部署时请设为 /data/swallow.db（对应 compose 的持久化卷）
dbPath: ./swallow.db
# 聚合历史保留天数：原始数据固定保留 1 天，5 分钟聚合数据按此天数保留，
# 1 小时聚合数据保留 365 天（不配置默认 7 天；显式 0 表示不清理聚合历史）
retentionDays: 7
# 超过该秒数未上报且无活动连接判定离线
offlineTimeout: 90
# 每 IP 每分钟允许的 /report 连接尝试次数（0 或负数 = 默认 30）
reportRateLimit: 30
# 受信任的反向代理 IP/CIDR 列表。仅当请求来自这些地址时才解析
# X-Forwarded-For 提取真实客户端 IP 用于速率限制。留空则直接使用 TCP 源地址。
# 常见场景：
#   直连无代理           → 留空（默认）
#   Nginx 在宿主机, 本容器 → ["172.16.0.0/12"]  （Docker 网关网段）
#   Nginx 与本服务同机    → ["127.0.0.0/8"]
#   Nginx 在另一台机器    → ["10.0.0.3"]        （Nginx 的具体 IP）
trustedProxies: []

# GitHub OAuth（生产启动必须配置完整；缺失时拒绝启动）
github:
  clientId: ""
  clientSecret: ""
  # 管理员 GitHub 用户名白名单；不能为空
  allowedUsers:
    - your-github-username

# 调试日志
isDebug: false
